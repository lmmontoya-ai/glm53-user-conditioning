  created_at_utc: '2026-09-03T03:42:00Z'
  reason: >-
    AutoProcessor.apply_chat_template(tokenize=true) returns a multimodal
    BatchFeature whose length is not a token count. The frozen contract is
    validated by rendering with the exact processor and tokenizing that string
