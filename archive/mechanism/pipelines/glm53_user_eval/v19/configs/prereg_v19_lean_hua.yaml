pre_scientific_amendment_r4:
  id: four_b300_throughput_only_r4
  created_at_utc: '2026-09-03T04:15:00Z'
  reason: >-
    The exact two-B300 runtime measured 1.088766947 prompts per second on 16
    score-blind timing rows. The unchanged 8,460-forward design therefore
    projected to 10,101 seconds with frozen headroom and could not fit the
    110-minute deadline. Four exact B300s are authorized solely to increase
    throughput while preserving the complete scientific design.
  triggering_run_id: glm53-v19-hua-20260903T034814Z-a198b786
  triggering_runtime_calibration_sha256: 66b7316d7039b2a9c8a7c28b02a47740c6e0c85be0aabf178f540ed9424d1ff4
  occurred_before_hua_positive_control: true
  observed_hua_positive_control_rows_before_amendment: 0
  observed_local_parity_rows_before_amendment: 0
  observed_causal_rows_before_amendment: 0
  changes_only:
    - gpu_count_from_2_to_4
    - aggregate_rate_cap_from_16_to_32_usd_per_hour
    - compute_cap_from_30_to_60_usd
    - minimum_post_run_balance_from_60_to_30_usd
  preserves:
    - exact_subject_checkpoint_and_software
    - batch_size_one
    - all_hua_directions_and_interventions
    - positive_control_surface_and_selection_rule
    - all_16_identities_per_group_and_25_dilemmas
    - all_five_conditions
    - all_estimands_thresholds_seeds_and_analysis

pre_scientific_amendment_r5:
  id: two_b300_extended_deadline_cumulative_budget_r5
  created_at_utc: '2026-09-03T04:55:00Z'
  reason: >-
    Four-way balanced layer placement measured only 0.644113007 prompts per
    second, versus 1.088766947 on two B300s, because this runtime executes the
    sharded layers sequentially. Return to the faster two-B300 topology and
    extend its deadline. To keep all attempts after the user's authorization
    below 60 USD, retain the first 23 of the 25 already hash-ordered dilemmas.
    The two omitted final task IDs were selected only by their prior order and
    cumulative runtime budget, before any Hua-control or user score existed.
  triggering_run_id: glm53-v19-hua-20260903T042842Z-8f10e10d
  triggering_runtime_calibration_sha256: 27a0c0cc8476169fc3cef72682cb45932c78cf81893a49c0c30709b21d48f0ed
  occurred_before_hua_positive_control: true
  observed_hua_positive_control_rows_before_amendment: 0
  observed_local_parity_rows_before_amendment: 0
  observed_causal_rows_before_amendment: 0
  changes_only:
    - gpu_count_from_4_to_2
    - dilemmas_from_25_to_first_23_in_frozen_order
    - planned_forwards_from_8460_to_7840
    - wall_clock_cap_from_110_to_186_minutes
    - per_launch_compute_cap_from_60_to_49_usd
    - minimum_post_run_balance_from_30_to_32_usd
  preserves:
    - exact_subject_checkpoint_and_software
