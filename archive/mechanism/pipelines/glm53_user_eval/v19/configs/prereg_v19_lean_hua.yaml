pre_scientific_amendment_r6:
  id: billing_settlement_budget_fit_r6
  created_at_utc: '2026-09-03T04:59:00Z'
  reason: >-
    Delayed billing settlement after the score-blind four-B300 timing attempt
    reduced the live balance to 80.327381 USD. A 186-minute two-B300 launch at
    the live 15.78 USD/hour rate could therefore exceed the user's cumulative
    60 USD authorization. Retain the first 22 of the 25 already hash-ordered
    dilemmas and cap the final run at 180 minutes and 48 USD. The newly omitted
    task is the last remaining task in the prior frozen order. No Hua-control or
    user score existed when this amendment was made.
  occurred_before_hua_positive_control: true
  observed_hua_positive_control_rows_before_amendment: 0
  observed_local_parity_rows_before_amendment: 0
  observed_causal_rows_before_amendment: 0
  changes_only:
    - dilemmas_from_first_23_to_first_22_in_frozen_order
    - planned_forwards_from_7840_to_7520
    - wall_clock_cap_from_186_to_180_minutes
    - per_launch_compute_cap_from_49_to_48_usd
  preserves:
    - exact_subject_checkpoint_and_software
    - two_b300_hardware_and_batch_size_one
    - all_16_identities_per_group
    - all_five_conditions
    - all_hua_directions_and_interventions
    - positive_control_surface_and_selection_rule
    - task_order_and_outcome_independent_selection
    - all_estimands_thresholds_seeds_and_analysis

pre_scientific_amendment_r7:
  id: reconstructable_transcript_count_fix_r7
  created_at_utc: '2026-09-03T05:20:00Z'
  reason: >-
    The frozen V7 cache contains four known rows in the selected 22-task design
    whose first assistant answer is empty, exactly one in each population. The
    r6 design counted all 1,408 planned cells as locally reconstructable instead
    of excluding these four rows. The paid runtime stopped on that fail-closed
    count check before executing a Hua positive-control or user-scoring forward.
    Correct the manifest to 1,404 reconstructable rows, 1,401 API-matched rows,
    and 7,020 user forwards. Add a regression test against the real frozen
    transcript cache. Reduce the remaining launch to 170 minutes and 44.80 USD
    so all V19 attempts remain inside the user's cumulative 60 USD limit.
  triggering_run_id: glm53-v19-hua-20260903T050134Z-a6c5407b
  occurred_before_hua_positive_control: true
  observed_hua_positive_control_rows_before_amendment: 0
  observed_local_parity_rows_before_amendment: 0
  observed_causal_rows_before_amendment: 0
  changes_only:
    - reconstructable_rows_from_1408_to_1404
    - api_matched_rows_from_1405_to_1401
    - user_forwards_from_7040_to_7020
    - planned_forwards_from_7520_to_7500
    - wall_clock_cap_from_180_to_170_minutes
    - per_launch_compute_cap_from_48_to_44_80_usd
    - add_real_cache_selection_regression_test
  preserves:
    - exact_subject_checkpoint_and_software
    - two_b300_hardware_and_batch_size_one
    - all_16_identities_per_group_and_first_22_tasks
    - all_five_conditions
    - all_hua_directions_and_interventions
    - positive_control_surface_and_selection_rule
    - all_estimands_thresholds_seeds_and_analysis

pre_scientific_amendment_r8:
  id: measured_stable_speed_headroom_r8
  created_at_utc: '2026-09-03T05:39:00Z'
  reason: >-
    Two independent exact two-B300 calibrations measured 1.088766947 and
    1.087603903 prompts per second, a difference of about 0.1 percent. The r7
    runtime stopped before the Hua positive control because its 30 percent
    scoring cushion plus a separate 10-minute backup reserve did not fit the
    shortened cumulative-budget deadline. Replace the scoring cushion with 10
    percent while retaining the separate 10-minute backup reserve. Apply the
    same frozen multiplier to the post-control remaining-work check. Cap the
    final launch at 150 minutes and 39.50 USD, preserving about 34.44 USD at the
    then-current balance under the user's cumulative 60 USD authorization.
  triggering_run_id: glm53-v19-hua-20260903T052206Z-b2b125b2
  triggering_runtime_calibration_sha256: 65dbd9ab518915db248ba8ddee64eefec55aafd7ae74dc3de1ab522ff4873c44
  occurred_before_hua_positive_control: true
  observed_hua_positive_control_rows_before_amendment: 0
  observed_local_parity_rows_before_amendment: 0
  observed_causal_rows_before_amendment: 0
  changes_only:
    - scoring_headroom_multiplier_from_1_30_to_1_10
    - use_frozen_headroom_in_post_control_projection
    - wall_clock_cap_from_170_to_150_minutes
    - per_launch_compute_cap_from_44_80_to_39_50_usd
  preserves:
    - exact_subject_checkpoint_and_software
    - two_b300_hardware_and_batch_size_one
    - all_16_identities_per_group_and_first_22_tasks
    - all_five_conditions
    - all_hua_directions_and_interventions
    - positive_control_surface_and_selection_rule
    - all_estimands_thresholds_seeds_and_analysis
    - separate_10_minute_backup_reserve

