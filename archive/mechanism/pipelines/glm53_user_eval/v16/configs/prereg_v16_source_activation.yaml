amendment_1:
  timing: after_original_preregistration_and_before_any_paid_resource_or_glm_forward
  reason: >-
    The first launcher invocation failed locally because PowerShell parsed the
    bucket name and query delimiter as one variable in the S3 credential probe.
    Bracing the already frozen bucket variable corrects only that fail-closed
    infrastructure expression.
  scientific_changes: none
  paid_resources_created_before_amendment: 0
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered
  active_prereg_tag: glm53-user-eval-v16-preregistered-a1

amendment_2:
  timing: after_amendment_1_and_before_any_paid_resource_or_glm_forward
  reason: >-
    V16 inherited a stale assumption that RunPod network volume a9diryunoj
    remained available. The immutable V12 cleanup evidence proves that this
    exact volume was deliberately deleted on 2026-09-01 after its evidence was
    backed up. RunPod now reports zero network volumes, so the old bucket cannot
    accept the V16 input bundle, heartbeats, or results. Create one temporary
    20 GB standard network volume in US-KS-2 for S3-compatible transport only,
    never mount it, bind its returned ID in launch evidence, and delete it after
    the terminal V16 backup.
  v12_pre_delete_evidence:
    path: artifacts/glm53_user_eval/v12/infrastructure/pre_delete_state.json
    sha256: 8d7196bccd42bc94e7f9c7219cc3c628a508ee5322b6964c01d32cbc5fec2397
  v12_post_delete_evidence:
    path: artifacts/glm53_user_eval/v12/infrastructure/post_delete_state.json
    sha256: e7d9997e731e71e1fe4eaf9be76a17460193f3f267a3024d631f05ac5bb63b04
  replacement_transport_volume:
    name: glm53-v16-transport
    data_center_id: US-KS-2
    size_gb: 20
    type: standard
    mounted_to_pod: false
    purpose: s3_input_heartbeat_and_result_transport_only
    deletion: required_after_terminal_backup
  scientific_changes: none
  paid_compute_created_before_amendment: 0
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a1
  active_prereg_tag: glm53-user-eval-v16-preregistered-a2

amendment_3:
  timing: after_amendment_2_and_before_any_pod_or_glm_forward
  reason: >-
    Two launcher invocations completed the non-scientific S3 input transfer but
    failed before template or Pod creation because PowerShell 7.6.5 rejected a
    nested native runpodctl invocation with an output-encoding host error. Use
    System.Diagnostics.Process with explicitly redirected UTF-8 output for the
    identical runpodctl commands. This changes only local process orchestration.
  scientific_changes: none
  transport_volume_created_before_amendment:
    id: yqs9l7a86w
    name: glm53-v16-transport
    data_center_id: US-KS-2
    size_gb: 20
    mounted: false
  pods_created_before_amendment: 0
  serverless_endpoints_created_before_amendment: 0
  glm_forwards_before_amendment: 0
  current_compute_spend_per_hour_usd: 0.0
  current_storage_spend_per_hour_usd: 0.002
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a2
  active_prereg_tag: glm53-user-eval-v16-preregistered-a3

amendment_4:
  timing: after_amendment_3_and_before_any_pod_or_glm_forward
  reason: >-
    The corrected native-process wrapper reached template construction, but
    Windows rejected the hash-bound bootstrap payload because it exceeded the
    operating-system command-line length limit. Submit the identical image,
    entrypoint, start command, environment, disk, ports, and exact GPU request
    directly in the documented RunPod Pod REST body. This removes the transient
    template and does not alter bootstrap bytes or scientific execution.
  scientific_changes: none
  pods_created_before_amendment: 0
  glm_forwards_before_amendment: 0
  current_compute_spend_per_hour_usd: 0.0
  current_storage_spend_per_hour_usd: 0.002
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a3
  active_prereg_tag: glm53-user-eval-v16-preregistered-a4

amendment_5:
  timing: after_amendment_4_and_before_any_glm_forward
  reason: >-
    The first Pod creation realized the exact preregistered two-GPU B300 ID,
    Secure Cloud tier, pinned image, disk topology, and $15.78 hourly rate, but
    RunPod omitted the redundant gpuDisplayName field while runtime status was
    initializing. The launcher correctly deleted the Pod before model staging.
    Retain exact machine.gpuId validation and remove only the non-authoritative
    display-name duplicate.
  realized_deleted_pod:
    id: pu8o7s69dsg6qy
    gpu_id: NVIDIA B300 SXM6 AC
    gpu_count: 2
    secure_cloud: true
    image_exact: true
    container_disk_gb: 450
    persistent_volume_gb: 0
    rate_usd_per_hour: 15.78
    deleted_before_model_stage: true
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a4
  active_prereg_tag: glm53-user-eval-v16-preregistered-a5

amendment_6:
  timing: after_amendment_5_and_before_any_glm_forward
  reason: >-
    The exact Pod passed topology, but the external watchdog was launched under
    legacy Windows PowerShell 5.1 and exited before its handshake because the
    verified launcher process code targets PowerShell 7. Start the watchdog
    under the same PowerShell 7 executable as the parent and capture its local
    stdout and stderr. The fail-closed launcher deleted the Pod before bootstrap
    or model staging.
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a5
  active_prereg_tag: glm53-user-eval-v16-preregistered-a6

amendment_7:
  timing: after_amendment_6_and_before_any_glm_forward
  reason: >-
    The PowerShell 7 watchdog reached its sleep-prevention call but parsed the
    hexadecimal continuous-execution flag as signed negative before UInt32
    conversion. Express the same Windows API flag as unsigned decimal
    2147483648. The fail-closed launcher again deleted the Pod before bootstrap.
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a6
  active_prereg_tag: glm53-user-eval-v16-preregistered-a7

amendment_8:
  timing: after_amendment_7_and_before_any_glm_forward
  reason: >-
    The Pod emitted a bound bootstrap heartbeat and then exited with code 1
    after seven seconds, before model staging or scientific work. Because the
    self-deleting Pod no longer exposes container logs, mirror bootstrap output
    to a local log and upload it inside the existing exit trap before deletion.
    This is diagnostic evidence only and changes no runtime command or gate.
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a7
  active_prereg_tag: glm53-user-eval-v16-preregistered-a8

amendment_9:
  timing: after_amendment_8_and_before_any_glm_forward
  reason: >-
    The captured bootstrap log proves apt setup and installation of pinned uv
    0.9.26 succeeded. The subsequent exact string check failed because the
    Linux binary omits the platform-specific build suffix expected from the
    workstation. Continue requiring semantic version 0.9.26 while permitting
    an optional build suffix.
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a8
  active_prereg_tag: glm53-user-eval-v16-preregistered-a9

amendment_10:
  timing: after_amendment_9_and_before_any_glm_forward
  reason: >-
    The exact checkpoint downloaded and passed its frozen hash manifest, but
    the paid supervisor stopped before model loading after the signed input
    bundle was reconstructed inside the Linux checkout. Replace the blanket
    clean-worktree rejection with an exact allowlist covering only the 20 files
    in that signed, hash-verified bundle. Continue rejecting every changed or
    untracked path outside that immutable input set.
  terminated_run:
    run_id: glm53-v16-source-20260902T012852Z-4f97da33
    pod_id: t2brokwujtrnoe
    exact_checkpoint_downloaded_and_hashed: true
    model_loaded: false
    glm_forwards: 0
    pod_deleted: true
  scientific_changes: none
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a9
  active_prereg_tag: glm53-user-eval-v16-preregistered-a10

amendment_11:
  timing: after_amendment_10_and_before_any_glm_forward
  reason: >-
    Count the terminated A9 attempt against the frozen V16 compute budget. The
    account balance fell from 43.7853868373 USD at launch to 41.9111829762 USD
    after deletion, a conservative 1.8742038611 USD charge including any small
    contemporaneous storage charge. Limit the next attempt to 23.00 USD and 86
    minutes so total V16 infrastructure spend remains below 25 USD while the
    account retains at least 15 USD.
  scientific_changes: none
  glm_forwards_before_amendment: 0
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a10
  active_prereg_tag: glm53-user-eval-v16-preregistered-a11

amendment_12:
  timing: after_amendment_11_and_before_any_glm_forward
  reason: >-
    The A11 run passed signed-input reconstruction and stopped before model
    loading because the Python guard required raw S3 secrets even though the
    bootstrap deliberately removes those secrets from the science process.
    Pass a non-secret flag only after the bootstrap's authenticated S3 probe,
    require raw S3 secrets to remain absent from the science process, and
    derive its effective cap from the launcher's balance floor. Conservatively
    reserve 5 USD of the original 25 USD cap for both terminated attempts and
    limit the final attempt to 20 USD and 75 minutes.
  terminated_run:
    run_id: glm53-v16-source-20260902T014333Z-2f95a2c3
    pod_id: qsgevvhgb5kq1f
    signed_input_guard_passed: true
    exact_checkpoint_downloaded_and_hashed: true
    model_loaded: false
    glm_forwards: 0
    pod_deleted: true
  scientific_changes: none
  superseded_prereg_tag: glm53-user-eval-v16-preregistered-a11
  active_prereg_tag: glm53-user-eval-v16-preregistered-a12

