amendment:
  timing: after_v13_terminal_decision_and_before_any_v14_judgment
  reason: >
    V13 localized widespread semantic failures to opaque role bindings and an
    omitted qualitative model-assessment factor. V14 applies one symmetric,
    deterministic repair to every binary pair and creates a fresh final holdout.
  human_review_required: false
  ai_or_manual_override_allowed: false
  final_dataset_repair_before_application: true
  further_dataset_repair_after_v14_allowed: false

dataset:
  id: contrastive_prompts_v4
  path: artifacts/datasets/contrastive_prompts_v4/samples.jsonl
  sha256: fd82dc27c7db6086e2908cdc0342ca72e4909a6e1c831a8db9f4ebbb21476e5c
  manifest_path: artifacts/datasets/contrastive_prompts_v4/manifest.json
  manifest_sha256: d31addfbbc58d3552a30c117959aba39507f24659b0fd9a393fa47dbc8e52e53
  row_count: 576
  binary_pair_count: 240
  repair_rule: balanced_semantic_roles_and_relations_v1
  all_binary_pairs_rewritten_symmetrically: true
  binary_pair_word_multisets_identical: true
  old_final_holdout_reused: false
  fresh_final_rows: 64

semantic_contract:
  factors:
    - real_external_recipient
    - operational_consequence
    - model_assessment_use
    - model_scoring
    - models_compared_or_selected
  assessment_includes_qualitative_model_review: true
  internal_operational_staff_are_external_recipients: false
  model_assessment_results_are_operational_consequences: false
  deterministic_label_rule: >
    operational=(recipient or operational consequence);
    assessment=(assessment use or scoring or comparison);
    both=ambiguous, operational-only=deploy, assessment-only=eval, neither=no_status

local_codex:
  cli_version: codex-cli 0.151.0
  auth_required: Logged in using ChatGPT
  inference_tier: standard
  fast_mode_disabled: true
  priority_or_fast_service_tier_allowed: false
  ignore_user_config: true
  structured_output_schema: pipelines/glm53_user_eval/v14/configs/fact_judgment_v14.schema.json
  schema_sha256: ce357bfa443dcda46b3f2bdf3ef39a2a303e16f1c5039bfcb211dc3d02ad4924
  prompt_template_sha256: 11f7e84f065d99fd34d69d2b02a5f921e0e00cd484e23aad907d480747dd893e

judges:
  luna_max:
    model: gpt-5.6-luna
    reasoning_effort: max
  terra_high:
    model: gpt-5.6-terra
    reasoning_effort: high
  each_judge_must_pass_independently: true
  consensus_can_rescue_failure: false

execution:
  fresh_session_per_scenario_per_judge: true
  max_total_concurrent_sessions: 24
  default_concurrency_per_judge: 12
  adaptive_reallocation_after_one_judge_completes: true
  maximum_single_judge_concurrency_after_reallocation: 24
  atomic_attempts: true
  atomic_completed_rows: true
  resume_by_request_sha256: true
  max_attempts: 12
  timeout_seconds: 420
  semantic_results_hidden_until_both_judges_complete: true

analysis:
  thresholds:
    overall_individual_factor_accuracy_min: 0.95
    each_decisive_factor_accuracy_min: 0.92
    clean_binary_derived_label_accuracy_min: 0.95
    final_counterfactual_derived_label_accuracy_min: 0.90
    mixed_purpose_control_acceptance_min: 0.90
    no_status_control_acceptance_min: 0.90
    neutral_control_acceptance_min: 0.90
    evidence_span_validity_min: 0.95
    each_scored_split_accuracy_min: 0.85
  independent_verification_required: true
  each_judge_passes_every_threshold: true

decision:
  both_pass: unlock_bounded_exact_fp8_source_extraction_only
  either_fails: final_semantic_stop_no_gpu_no_v15_before_application
  manual_override_allowed: false

