  metrics_computed_before_amendment: 0
  changes:
    - add_the_locked_v9_adamw_trainer_to_the_fixed_split_comparison
    - compute_ledoit_wolf_lda_with_an_equivalent_192_row_woodbury_dual_solve
    - fit_one_128_component_training_only_pca_basis_per_layer_then_slice_nested_dimensions
  scientific_methods_thresholds_splits_and_inputs_changed: false
technical_amendment_v1_2:
  timing: after_initial_locked_analysis_before_final_evidence
  reason: >
    The initial report calculated cosines between validation-selected models at
    different layers. Although every vector has 4096 coordinates, coordinates
    at different layers are not the same representation space. V1.2 removes
    those descriptive values. It retains the preregistered within-method,
    same-layer bootstrap cosine-to-full analysis. No fit, metric, split,
    threshold, or conclusion changes.
  initial_analysis_sha256: 13515f04b144146772e0b29984accd35d38380dc5f692eeddf239b50b986fb14
  scientific_metrics_changed: false
scientific_reason: >
  V9 correctly implemented its cue-masked readout contract, but perfect ordinary
  held-out AUROC coexisted with failed hard-negative and neutral controls. This
  frozen offline audit separates trainer sensitivity, family/task distribution
  shortcuts, structural metadata leakage, counterfactual failure modes, and
  direction instability before authorizing any new model forward.
