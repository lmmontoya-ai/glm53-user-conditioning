  previous_prereg_sha256: 7c95ac4a8d4161efd215ed9f25abd95e3f5d3bdc5498c95d23ae7255f85086a4
  prior_stop_tag: glm53-user-eval-v8-infrastructure-stopped
  prior_stop_commit: 53f58607
  resume_authorization: explicit_user_request_2026_08_31_four_h200_or_more
  completion_audit_commit: 466908d5329a11d63f71898c5d93579371e48952
  completion_audit_path: pipelines/glm53_user_eval/v8/status/COMPLETION_AUDIT_20260830.md
  completion_audit_sha256: 4ab97774d06135673e160c51b977774270b81380c772f21bea20700ec2555f24
  timing: after_v1_18_audio_resolution_failed_and_before_any_model_load_or_forward
  reason: >-
    V1.16 successfully validated PyTorch 2.13.0 CUDA 13.0, Triton 3.7.1, and a
    fine-grained FP8 matmul on B300. The supervisor then stopped during imports,
    before model loading or a forward, because the project environment retained
    an older torchvision package whose operators were incompatible with PyTorch
    2.13. V1.17 pins the matching official torchvision 0.28.0 CUDA 13.0 wheel
    and adds an AutoProcessor import check before model loading. It permits one
    same-Pod retry. The pre-load AutoProcessor check then discovered an older
    torchaudio binary paired to PyTorch 2.8. V1.18 attempted to pin a matching
    torchaudio 2.13.0 wheel, but no such stable wheel exists on the official
    CUDA 13 index. The resolver failed before changing the runtime. Audio is an
    unused optional dependency in this text-only experiment. V1.19 explicitly
    removes the incompatible legacy torchaudio package after installing torch
    2.13.0 and torchvision 0.28.0, then requires AutoProcessor and model-class
    imports to pass before model loading. Balanced placement, the checkpoint,
    and the entire
    scientific contract remain unchanged.
    It does not change the checkpoint, prompts, identities, tasks, codebooks,
    estimands, thresholds, bootstrap schedules, or downstream scientific gates.
  v8_model_forwards_before_amendment: m2_calibration_only_no_completed_gate
  v8_scientific_rows_before_amendment: 0
  completed_m2_reports_before_amendment: 0
  scientific_contract_changed: false
  preserves:
