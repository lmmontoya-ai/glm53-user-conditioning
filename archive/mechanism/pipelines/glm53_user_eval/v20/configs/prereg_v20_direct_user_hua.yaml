title: Direct Hua intervention on GLM-5.3 user-conditioned confidence

rationale:
  parent_result: >-
    V19 tested whether Hua steering reliably changed an explicit eval/deploy
    classification. That auxiliary test failed its frozen consistency gate and
    no user-facing row was scored.
  correction: >-
    Hua's causal validation concerned an already present conditional behavior,
    not an explicit report of context. V20 prospectively applies the unchanged
    external intervention to GLM's independently confirmed user-conditioned
    behavior. V19 remains final and unchanged.
  non_circularity:
    - Hua source prompts contain no Transluce user identities or outcomes.
    - V19 extracted all directions before any V20 target score exists.
    - Literal layers and alpha are fixed from Hua and cannot be selected by V20.
    - Identities, dilemmas, codebooks, controls, and statistics are frozen.

