technical_amendment_v1_3:
  timing: after_successful_feature_extraction_and_failed_pre_metric_probe_start
  reason: >
    The first offline fit attempt stopped while converting the 32 governed
    neutral-decoy labels from None to an integer array. Other v9 paths already
    encode neutral decoys as -1. V1.3 applies that same declared encoding in the
    sequence fitter and asserts that train and validation rows remain binary.
    No probe metric, selected layer, permutation result, or token-MIL result was
    produced before this correction. Scientific features, optimizer, null,
    layer selection, thresholds, and gates are unchanged.
  successful_probe_fits_before_amendment: 0
  scientific_metrics_before_amendment: 0
technical_amendment_v1_2:
  timing: after_exact_model_load_diagnostics_and_before_any_v9_forward
  reason: >
    V1 expected 90 forget-gate inverse-scale tensors by interpreting the
    Transformers compressed missing-key display as applying to all 45 layers.
    The locked model config contains 34 linear-attention layers, which have two
    forget-gate projections each, and 11 sparse-attention layers without those
    projections. The loaded model therefore correctly exposes 68 tensors. V1.2
    derives the exact expected tensor names from the locked layer-type schedule
    and requires all 68 to be present and finite. Scientific data, prompts,
    masks, representations, optimizer, null, gates, and budget are unchanged.
  model_forwards_before_amendment: 0
  scientific_rows_before_amendment: 0
  observed_linear_attention_layers: 34
  observed_sparse_attention_layers: 11
  observed_forget_gate_scale_inv_tensors: 68
technical_amendment_v1_1:
  timing: after_model_staging_and_before_model_loading_or_any_v9_forward
  reason: >
    V1 stored SHA-256 values of three text working-tree files from a Windows
    CRLF checkout. A Linux clone has canonical LF bytes, so validation stopped.
    V1.1 locks SHA-256 values of canonical Git blob bytes instead. Scientific
    data, prompts, masks, representations, optimizer, null, gates, and budget
    are unchanged.
  model_forwards_before_amendment: 0
  scientific_rows_before_amendment: 0
  reuse_existing_pod: v6w0o4uykl6csw
scientific_correction:
  parent_v8_result: stopped_at_m3
  reason: >
    V8 used an unmasked final-prompt-token representation. It did not implement
    the prior paper's cue-masked prompt mean, prompt-first-plus-replay transfer,
    or token-MIL surface. V9 prospectively tests the pre-existing paper method.
  v8_results_role: diagnostic_only_not_v9_evidence
  threshold_change: false
