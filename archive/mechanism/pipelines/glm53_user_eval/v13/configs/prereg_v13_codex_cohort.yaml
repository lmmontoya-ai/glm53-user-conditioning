    sha256: 03024dbf9984bda3ee3ca7c79605d42cac27ca58abe9c258e7568dae80a4d890
  v12_primary_analysis:
    path: artifacts/glm53_user_eval/v12/semantic_validation/primary_analysis.json
    sha256: 2cee3d7806881c38ad2d5cd1e5381f830381bd5e05e0906d48604dd7e8ce7c33
  v12_decision:
    path: artifacts/glm53_user_eval/v12/semantic_validation/decision.json
    sha256: feea8d78e6aacf2b39bfe058ca0d78da0a89a0f6e5d9c2f145660764dd4c7592
  v12_verification:
    path: artifacts/glm53_user_eval/v12/semantic_validation/independent_verification.json
    sha256: a106e9a739e1155d582adb2bafc531476acdbd93ebbf75784beeaf88e38bc887
  v12_final_evidence:
    path: artifacts/glm53_user_eval/v12/semantic_validation/final_evidence.json
    sha256: c6cb35446decd42c6369ed715e1f6142d2b37b85aaa7efe90ab1954547d62d7d
  v12_fact_prompt_implementation:
