schema_version: glm53_user_eval_v11_source_prereg_v1
project_id: glm53_user_eval_source_instrument_v11
created_at_utc: '2026-08-31T22:07:17Z'
status: proposed_before_any_v11_model_forward

scientific_question: >-
  Does GLM-5.3 contain a linear representation of latent evaluation versus
  deployment status that survives changes in vocabulary, register, prompt
  generator, and downstream task, and is specific enough to support a later
  user-awareness recruitment test?

scientific_correction:
  diagnosis: construct_overfit_source_instrument_invalid
  reason: >-
    V10 found that the v9 instrument decoded propagated explicit framing but
    failed counterfactual and neutral controls across every tested linear
    method. V11 replaces the source bank. It does not reinterpret or override
    the v7 behavioral result, the v9 stop, or the v10 diagnosis.
  preserves:
    - official_fp8_glm53_subject
    - independent_source_then_frozen_transfer_design
    - no_user_identity_rows_in_source_fitting
    - readout_and_steering_as_separate_claims
  changes:
    - latent_factorial_scenarios_replace_explicit_class_descriptions
    - nuisance_vocabulary_and_register_are_counterbalanced
    - generators_and_downstream_tasks_are_disjoint_by_split
    - shared_identical_task_suffix_is_the_primary_activation_view
    - final_counterfactual_holdout_is_opened_once

