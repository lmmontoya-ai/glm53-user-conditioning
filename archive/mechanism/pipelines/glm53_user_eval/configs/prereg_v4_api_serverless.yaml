amendment:
  timing: after_g3_serving_final_stop_and_before_any_api_scientific_call
  reason: >-
    The exact FP8 checkpoint passed white-box validation, but every bounded self-hosted
    behavioral-serving path stopped before producing a scientific row. Reinstate a pinned
    first-party Z.AI OpenRouter behavior gate. RunPod Serverless cached-model work is locked
    until this API gate passes.
  preserves:
    - model_family
    - model_revision_for_downstream_exact_weight_work
    - identity_selection
    - primary_four_pairs
    - behavior_main_50
    - source_600_row_schedule
    - prompts
    - reasoning_effort_max
    - behavioral_estimands
    - g3_thresholds
    - downstream_direction_definitions
  api_parameter_boundary:
    observed_before_calls: >-
      OpenRouter's endpoint metadata lists reasoning_effort, reasoning, include_reasoning,
      temperature, top_p, and max_tokens for first-party Z.AI, but does not list seed or the
      provider-specific clear_thinking object.
    scientific_resolution: >-
      Keep generation_seed=42 in immutable schedule identities, but do not send seed or the
      undeclared thinking object to the API. Request max reasoning and reasoning disclosure.
      Treat API and exact-checkpoint runs as different serving stacks and never pool them.
  judge_route_amendment:
    timing: after_first_four_call_smoke_failed_and_before_any_completed_scientific_row
    observed_failure: openai_first_party_credit_balance_exhausted
    completed_scientific_rows: 0
    subject_calls_before_failure: 2
    correction: >-
      Route the same dated GPT-5.4 Mini extraction model through OpenRouter's first-party OpenAI
      endpoint, with fallbacks disabled and router metadata enabled. Checkpoint each subject turn
      atomically before invoking either judge.
    frozen_subject_schedule_unchanged: true
  binary_extractor_amendment:
    timing: after_one_route-valid-smoke-row_and_before_any_progressive_scientific_stage
    observed_failure: >-
      The subject answered exactly Yes. The LLM binary judge also returned Yes but omitted its
      required ANSWER prefix, leaving the row invalid under evaluator v1.
    correction: >-
      Parse only exact yes/no subject replies deterministically, including terminal punctuation.
      Use the frozen LLM judge only as a fallback for non-exact replies. Reanalyze the immutable
      smoke output without rerunning either subject or judge calls.
    completed_rows_before_correction: 1
    effect_inspected_before_correction: false
    frozen_subject_schedule_unchanged: true
    behavioral_thresholds_unchanged: true

