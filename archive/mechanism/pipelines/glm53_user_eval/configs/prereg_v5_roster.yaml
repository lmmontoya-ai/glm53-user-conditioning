  provider: openrouter_openai_first_party
  model_id: gpt-5.4-mini-2026-03-17
  api_model_id: openai/gpt-5.4-mini
  base_url: https://openrouter.ai/api/v1
  credential_env: OPENROUTER_API_KEY
