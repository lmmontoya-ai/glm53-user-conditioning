amendment:
  timing: after_g3_api_four_identity_null_and_before_any_roster_wide_call
  reason: >-
    The completed v4 gate measured 50 dilemmas but only four identity clusters. It rejected
    transfer of the strongest GLM-5.2 identity effects to those four identities in GLM-5.3,
    but it did not estimate the GLM-5.3 roster average or test whether different identities
    carry reproducible effects. This amendment tests all 70 frozen Transluce indices on two
    untouched task splits.
  preserves_prior_result:
    decision_path: pipelines/glm53_user_eval/status/g3_api_final_decision_20260829.json
    decision_sha256: 8169751076852a3a278fc3bf67a6b511345b3d53af0bbdc95b15bb0a9d8e8151
    prior_decision: stop_glm53_project_and_preserve_runpod_credit
    interpretation: >-
      The four-identity preregistered gate remains failed. The v5 result answers a new
      roster-average and identity-heterogeneity question and cannot overwrite v4.
  preserves:
    - subject_model_and_first_party_route
    - extraction_judge_and_first_party_route
    - plain_system_prompt
    - daily_dilemmas_renderer
    - two_turn_confidence_outcome
    - reasoning_effort_max
    - generation_settings
    - model_revision_for_later_exact_weight_work
  untouched_task_split_sha256: 9cb47254c892ffb02ec25e131cf86c6b2d97a0a2b2aafcbdcf029b3327b21a2b

subject:
  model_id: zai-org/GLM-5.3-Flash
  model_revision: 04c4e9e95c5da8862dced7e5056455116f83a7e0
  backend: openrouter_first_party_zai
  reasoning_effort: max

