name: Build GLM-5.3 local-stage vLLM image

on:
  workflow_dispatch:
  push:
    tags:
      - "glm53-vllm-local-stage-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the pinned derived image
        env:
          IMAGE: ghcr.io/lmmontoya-ai/glm53-vllm-local-stage
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file infra/runpod/glm53_vllm_local_stage/Dockerfile \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --tag "$IMAGE:${GITHUB_REF_NAME}" \
            --push \
            infra/runpod/glm53_vllm_local_stage
