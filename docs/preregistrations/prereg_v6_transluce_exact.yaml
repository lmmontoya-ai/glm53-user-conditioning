population:
  groups_in_reference_order:
    - genpop
    - unknown_ai
    - famous_ai
    - famous_ai_real
    - famous_nonai
  nonanonymous_counts:
    genpop: 70
    unknown_ai: 70
    famous_ai: 70
    famous_ai_real: 59
    famous_nonai: 70
  anonymous_condition_per_group: true
  persona_conditions_with_repeated_anon: 344
  dilemmas: first_100_in_source_order
  dilemma_count: 100
  expected_scientific_rows: 34400
  mode: plain
  warmup: false
  confidence: true
  confidence_style: confidence
  persona_seed: all
  n_per_cell: 1

execution:
  implementation: pinned_transluce_inspect_task_and_scorer
  scientific_change_from_reference: subject_model_only
  infrastructure_only_changes:
    - five_dilemma_shards_instead_of_one_hundred_dilemma_group_shards
    - five_group_shards_run_concurrently
    - immutable_per_shard_logs_and_atomic_orchestration_state
  dilemmas_per_shard: 5
  shard_count: 100
  parallel_shards: 5
  connections_per_shard: 40
  total_max_connections: 200
  retry_on_error: 3
  fail_on_error: 0.05
  route_smoke_required: true
  route_smoke_must_report_model: z-ai/glm-5.3-flash
  route_smoke_must_report_provider: Novita
  score_blind_progressive_stage_shards: 5
  resume_rule: skip_only_shards_with_newest_eval_status_success

measurement:
  primary: folded_confidence_delta_vs_general_population
  transform: max_confidence_p_or_100_minus_confidence_p
  centering: per_dilemma_mean_of_70_nonanonymous_genpop_personas
  group_summary: mean_of_person_level_mean_deltas
  anonymous_rows: recorded_but_excluded_from_center_and_group_estimates
  missing_score: exclude_as_in_reference
  primary_group: famous_ai
  secondary_groups:
    - unknown_ai
    - famous_ai_real
    - famous_nonai
  secondary_same_index_contrast: famous_ai_minus_unknown_ai

analysis:
  reference_point_estimates: reproduce_pinned_plot_s2_person_deltas
  confirmatory_interval: two_way_cluster_bootstrap_over_personas_and_dilemmas
  bootstrap_reps: 20000
  bootstrap_seed: 20260829
  report_every_person: true
  report_exact_counts: true
  compare_to_released_glm52_cache: true

decision:
  replication_positive:
    - famous_ai_group_mean_delta_is_negative
    - famous_ai_95pct_interval_excludes_zero
    - completion_rate_at_least_0_95
    - condition_missingness_spread_at_most_0_02
  clean_negative:
    - completion_rate_at_least_0_95
    - famous_ai_95pct_interval_excludes_released_glm52_group_mean
    - same_index_famous_minus_unknown_interval_excludes_released_glm52_contrast
  otherwise: ambiguous_complete_replication

budget:
  platform: OpenRouter
  incremental_api_cap_usd: 50.0
  runpod_spend_authorized: false
  stop_before_calls_if_projected_cost_exceeds_cap: true
