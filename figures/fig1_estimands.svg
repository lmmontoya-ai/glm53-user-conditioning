   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(17.847469 302.087789)">and-dilemma bootstrap intervals (20,000 draws). The confirmatory interaction of -0.65 pp is 0.06 of the response-level SD</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(17.847469 312.89025)">(10.8 pp). Valid rows in the four populations: 27,954 (discovery), 27,956 (confirmatory); 70 identities per population.</text>
  </g>
