[project]
name = "glm53-user-conditioning"
version = "0.1.0"
description = "User-identity conditioning of stated confidence in GLM-5.3-Flash on the pinned Transluce user-awareness task"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    "scipy>=1.16,<2",
    "pyyaml>=6.0.3,<7",
    "matplotlib>=3.10,<4",
    "scikit-learn>=1.7,<2",
    "anthropic>=1,<2",
    "python-dotenv>=1.1,<2",
    "inspect-ai==0.3.223",
    "inspect-swe==0.2.55",
    "pillow>=11,<12",
    "adjusttext>=1.3,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "detect-secrets>=1.5,<2",
]
# Dependencies the mechanism archive (archive/mechanism) imported. They are not needed by
# src/glm53 or scripts/. The archive is kept unchanged and is not maintained here.
mechanism-archive = [
    "torch>=2.7",
    "transformers>=4.55",
    "accelerate>=1.11",
    "huggingface-hub>=0.35",
    "safetensors>=0.5",
    "statsmodels>=0.15",
    "openai>=2.6",
    "pyarrow>=21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive"]

[tool.uv]
default-groups = ["dev"]
