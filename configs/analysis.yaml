# Estimands, measurement, and uncertainty settings. Seeds reproduce the committed numbers.
schema_version: glm53_user_conditioning_analysis_v1

measurement:
  transform: folded_confidence            # max(p, 100 - p), percentage points
  centering: per_dilemma_mean_of_valid_nonanonymous_genpop_rows
  identity_summary: mean_across_valid_dilemmas
  group_summary: equal_weight_mean_across_identities
  anonymous_rows: excluded

estimands:
  U-G: unknown_ai_minus_genpop
  F-U: famous_ai_minus_unknown_ai
  FN-G: famous_nonai_minus_genpop
  interaction: (F-U)-(FN-G)
  F-G: famous_ai_minus_genpop
  Freal-G: famous_ai_real_minus_genpop
  address: famous_ai_real_minus_famous_ai_matched_slug

bootstrap:
  reps: 20000
  confidence_level: 0.95
  percentile: [2.5, 97.5]
  dilemma_draw: shared_across_groups
  famous_unknown_identity_draw: paired_same_index
  other_group_identity_draws: independent
  genpop_center: recomputed_inside_each_draw
  seeds:
    confirmatory_interaction: 20260830
    confirmatory_verifier: 20260831
    confirmatory_address: 21260830          # interaction seed + 400 as in the committed analysis
    discovery_group_deltas_base: 20260829   # group index i uses base + i, order genpop, unknown_ai, famous_ai, famous_ai_real, famous_nonai
    discovery_paired_contrast: 20260929     # base + 100
    discovery_interaction: 20260829        # new: same crossed bootstrap as confirmatory, discovery seed
    decomposition: 20260923
    identities: 20260901
    roles: 20260902
    transcripts: 20260903
    positive_control: 20260904

tolerances:
  point_estimate: 1.0e-9
  ci_endpoint: 1.0e-6

mann_whitney:
  implementation: pinned_transluce_tie_aware_normal_approximation
  bonferroni_family_size: 28

response_level_sd_pp: 10.9   # per-row standard deviation of folded confidence in the confirmatory run; stage 01 recomputes and reports it

